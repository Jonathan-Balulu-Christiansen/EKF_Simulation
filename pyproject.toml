[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[project]
name = "ekfsim"
version = "0.0.1"
description = "Radar tracking of a generic ballistic vehicle with an Extended Kalman Filter: 3-DOF physics, X-band radar model, 10-state EKF with BOOST/BALLISTIC modes, live 3D UI"
readme = "README.md"
requires-python = ">=3.12"
authors = [{ name = "Jonathan Balulu Christiansen" }]
# loose lower bounds here; the exact tested versions are pinned in requirements.txt
dependencies = [
    "numpy>=2.0",
    "scipy>=1.13",
    "matplotlib>=3.8",
    "PySide6-Essentials>=6.8",  # Core, Gui, Widgets, OpenGL and the SVG image plugin; the Addons are not used
    "pyqtgraph>=0.14,<0.15",
    "PyOpenGL>=3.1.7",
]

[project.optional-dependencies]
test = ["pytest>=8"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
ekfsim_ui = ["assets/fonts/*.ttf", "assets/fonts/OFL.txt", "assets/icons/*.svg"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
addopts = "-ra"
